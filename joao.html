<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>João Sobroza - T20</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0" id="title"></h4>
        </div>
        <div class="card-body p-4">
          <div class="mb-4">
            <h6 class="text-uppercase text-muted fw-bold mb-2">
              <i class="fas fa-school me-2"></i>Formação Acadêmica
            </h6>
            <p class="mb-0">
              Cursando <strong>Análise e Desenvolvimento de Sistemas</strong> no
              Instituto Federal Farroupilha - Campus São Vicente do Sul.
            </p>
          </div>

          <hr />

          <div class="mb-4">
            <h6 class="text-uppercase text-muted fw-bold mb-2">
              <i class="fas fa-briefcase me-2"></i>Experiência Profissional
            </h6>
            <p class="mb-0">
              Estágio na <strong>Prefeitura de Jaguari</strong>: suporte técnico
              auxiliando o Analista de Sistemas.
            </p>
          </div>

          <hr />

          <a href="index.html" class="btn btn-primary btn-sm">
            <i class="fa fa-arrow-left"></i> Voltar
          </a>
        </div>
      </div>
    </div>

    <script>
      const text = "João Victor Sobroza Dal Ross - ADS 20";
      const title = document.getElementById("title");

      let i = 0;

      function typeEffect() {
        if (i < text.length) {
          title.innerHTML += text.charAt(i);
          i++;
          setTimeout(typeEffect, 40);
        } else {
          title.style.borderRight = "none";
        }
      }

      window.onload = () => {
        setTimeout(() => {
          typeEffect();
        }, 500);
      };
    </script>
  </body>
</html>
